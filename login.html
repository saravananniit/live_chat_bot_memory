<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdf8f6">
  <title>Log in - YourBot</title>
  <link rel="stylesheet" href="/static/yourbot.css">
  <script>
    // Apply the saved theme before the page paints (no flash).
    try { if (localStorage.getItem("yourbot-theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
  </script>
</head>
<body>
  <!-- YourBot logo, defined once and reused with <use> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 40 40">
      <rect class="logo-bg" width="40" height="40" rx="12"/>
      <path class="logo-fg" d="M20 8v4" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle class="logo-fg" cx="14.5" cy="20" r="2.3" stroke="none"/>
      <circle class="logo-fg" cx="25.5" cy="20" r="2.3" stroke="none"/>
      <path class="logo-fg" d="M14.5 26.5c2.6 2.4 8.4 2.4 11 0" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    </symbol>
  </svg>

  <main class="auth-screen">
    <div class="auth-wrap">
      <div class="auth-top"><button class="icon-btn" id="theme" type="button" aria-label="Toggle theme">◐</button></div>
      <div class="auth-card">
        <header class="auth-head">
          <div class="brand"><svg class="brand-mark"><use href="#logo"/></svg><span>YourBot</span></div>
          <h1 id="title">Welcome back</h1>
          <p id="subtitle">Log in to continue your conversations with YourBot.</p>
        </header>

        <div id="error" class="error-box hidden" role="alert">
          <span id="errorText"></span>
          <button type="button" id="errorClose" aria-label="Dismiss">✕</button>
        </div>

        <form class="auth-form" id="form">
          <div class="field hidden" id="nameField">
            <label for="name">Your name</label>
            <input id="name" autocomplete="name" placeholder="Alex Morgan" maxlength="60">
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required>
              <button class="icon-btn" type="button" id="eye" aria-label="Show password">👁</button>
            </div>
          </div>
          <div class="field hidden" id="confirmField">
            <label for="confirm">Confirm password</label>
            <input id="confirm" type="password" autocomplete="new-password" placeholder="Enter your password again">
          </div>
          <button class="btn" id="submit" type="submit">Log in →</button>
        </form>

        <p class="auth-switch" id="switch"></p>
      </div>
      <p class="note">Your conversations are private to your account.</p>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = "login";

  function setMode(m) {
    mode = m;
    const signup = m === "signup";
    $("title").textContent = signup ? "Create your account" : "Welcome back";
    $("subtitle").textContent = signup ? "Start exploring calm, thoughtful conversations."
                                        : "Log in to continue your conversations with YourBot.";
    $("nameField").classList.toggle("hidden", !signup);
    $("confirmField").classList.toggle("hidden", !signup);
    $("confirm").required = signup;
    $("submit").textContent = signup ? "Create account" : "Log in →";
    $("password").autocomplete = signup ? "new-password" : "current-password";

    const sw = $("switch");
    sw.textContent = signup ? "Already have an account? " : "Don't have an account? ";
    const b = document.createElement("button");
    b.type = "button"; b.className = "text-btn";
    b.textContent = signup ? "Log in" : "Create an account";
    b.onclick = () => setMode(signup ? "login" : "signup");
    sw.appendChild(b);
    hideError();
  }

  function showError(text) { $("errorText").textContent = text; $("error").classList.remove("hidden"); }
  function hideError() { $("error").classList.add("hidden"); }
  $("errorClose").onclick = hideError;

  $("eye").onclick = () => {
    const show = $("password").type === "password";
    $("password").type = show ? "text" : "password";
    $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
  };

  $("theme").onclick = () => {
    const dark = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("yourbot-theme", dark ? "dark" : "light"); } catch (e) {}
  };

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();
    const password = $("password").value;
    if (mode === "signup") {
      if (password.length < 8) return showError("Choose a password with at least 8 characters.");
      if (password !== $("confirm").value) return showError("Those passwords do not match. Please try again.");
    }
    $("submit").disabled = true;
    try {
      const res = await fetch(mode === "login" ? "/auth/login" : "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: $("email").value, password, name: $("name").value }),
      });
      const data = await res.json();
      if (data.status === "ok") { location.href = "/"; return; }
      showError(data.message || "Something went wrong. Please try again.");
    } catch (err) {
      showError("Could not reach the server. Please try again.");
    }
    $("submit").disabled = false;
  });

  setMode("login");
</script>
</body>
</html>
